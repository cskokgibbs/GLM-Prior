# Training settings (used directly by finetune_nt.py and tokenize_sequences.py)
training_args:
  output_dir: "/mnt/ceph/users/cskokgibbs/2026/GLM-Prior-Experiments/HepG2/"  # required; set via CLI: training_args.output_dir=/path/to/experiment
  learning_rate: 1e-5
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 16
  logging_steps: 1
  num_train_epochs: 10
  report_to: "wandb"
  seed: 42
  do_eval: True
  eval_strategy: "steps"
  save_strategy: "steps"
  eval_steps: 0.05
  save_steps: 0.1
  include_inputs_for_metrics: True
  log_level: "info"
  logging_first_step: True
  label_names: ["labels"]
  load_best_model_at_end: True
  save_total_limit: 2
  metric_for_best_model: "best_f1_from_thresholding"
  greater_is_better: True
  dataloader_drop_last: False
  #ddp_backend: "nccl"
  #local_rank: -1

script_args:
  # Pipeline orchestration settings
  overwrite: False
  conda_env: pmf-prior-network
  inference_chunk_size: 1000  # number of genes per inference SLURM array task
  num_gpus: 1  # set >1 to launch training with torchrun (DDP)
  email: cskokgibbs@flatironinstitute.org
  slurm_output_dir: null
  log_level: info

  # Data
  model_name_or_path: "InstaDeepAI/nucleotide-transformer-v2-250m-multi-species"
  gene_tf_prior_data: "data/HepG2/Human_String_Trrust_no_gene_tf_label_overlap_with_HepG2.tsv"
  gene_dna_sequences: "data/HepG2/HepG2_gene_DNA_seqs_no_GTL_overlap.tsv"
  tf_dna_sequences: "data/HepG2/HepG2_TFs_DNA_seqs_no_GTL_overlap.tsv"
  train_prop: 0.99
  downsample_rate: 0.4
  max_eval_examples: 1000
  max_length: 512

  # Wandb
  wandb_project: "HepG2_run1"
  wandb_run_name: "Refactor"
  wandb_entity: "pmf-grn-3dc"

  # Training options
  sanity_check: False
  torch_dtype: null
  class_weights: [1.0, 1.0]
  classification_threshold: 0.5
  use_even_class_sampler: True

inference_args:
  gene_dna_sequences: "data/HepG2/HepG2_gene_DNA_seqs.tsv"
  tf_dna_sequences: "data/HepG2/HepG2_TF_DNA_seqs.tsv"
  gold_standard_data: "data/HepG2/HepG2_RefNetwork.tsv"
  gpu_batch_size: 64
  slurm_profile: legacy_a100
